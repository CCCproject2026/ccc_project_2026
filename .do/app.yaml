alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: ccc-project-2026-main-web
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: elderlyfalldetection
region: sgp
services:
- dockerfile_path: main/web/Dockerfile
  github:
    branch: main
    repo: CCCproject2026/ccc_project_2026
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  name: ccc-project-2026-main-web
  source_dir: main/web
