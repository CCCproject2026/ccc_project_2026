services:
  ai-server:
    build:
      context: ./main/ai
      target: runner
    # 開発用ポート。本番用ポートは未決定。
    ports:
      - "127.0.0.1:8000:8000"
    # 起動入口は Dockerfile に集約。Broker接続はアプリ側で再試行。
    env_file:
      - ./main/ai/.env.docker
    environment:
      MQTT_HOST: mqtt-broker
    depends_on:
      mqtt-broker:
        condition: service_healthy
    # ready は実パイプライン未実装のため 503。ここでは live を確認する。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s
    stop_grace_period: 10s
    restart: "no"

  web-app:
    build:
      context: ./main/web
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no" # 開発中は手動再起動しやすいよう再起動しない

  # 起動時にスキーマを最新化し、開発用シードも適用する一度きりのサービス（Exited (0) で正常終了）
  migrate:
    build:
      context: ./main/web
      target: prisma-cli
    command: sh -c "pnpm prisma:deploy && pnpm prisma:seed"
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./main/web
      target: prisma-cli
    command: pnpm prisma:seed
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools
    restart: "no"

  prisma:
    build:
      context: ./main/web
      target: prisma-cli
    env_file:
      - ./main/web/.env.docker
    volumes:
      - ./main/web/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  mqtt-broker:
    # Pinned to current eclipse-mosquitto:2 index digest for reproducible builds (resolved 2.1.2-alpine at pin time).
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    container_name: ccc_mqtt_broker
    ports:
      - "127.0.0.1:1883:1883"     # devices + AI server (bind to localhost for now; change for LAN/device testing)
      - "127.0.0.1:9001:9001"     # browser MQTT over WebSocket (localhost-only for now)
    volumes:
      - ./main/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db:
    # Pinned to current postgres:15-alpine index digest for reproducible builds (resolved 15.20-alpine3.24 at pin time).
    image: postgres:15-alpine@sha256:23799e521dee9265a8b388ecf3bc0f1eaa34b95be67f5a76af4f8f6adb44c720
    container_name: ccc_postgres_db
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - ./main/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  mqtt_data:
