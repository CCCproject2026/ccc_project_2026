services:
  web-app:
    build: ./main/web
    ports:
      - "3000:3000"
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 起動時にスキーマを最新化する一度きりのサービス（Exited (0) で正常終了）
  migrate:
    build:
      context: ./main/web
      target: builder
    command: pnpm prisma:deploy
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  prisma:
    build:
      context: ./main/web
      target: builder
    env_file:
      - ./main/web/.env.docker
    volumes:
      - ./main/web/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"

  # ユニットテスト（Vitest）。DB 不要。tools プロファイルでのみ有効。
  #   docker compose run --rm test
  test:
    build:
      context: ./main/web
      target: builder
    command: pnpm test
    profiles:
      - tools
    restart: "no"

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ccc_mqtt_broker
    ports:
      - "1883:1883"     # devices + AI server
      - "9001:9001"     # browser (MQTT over WebSocket)
    volumes:
      - ./main/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ccc_postgres_db
    ports:
      - "5433:5432"
    env_file:
      - ./main/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccc_project -d ccc_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  mqtt_data:
