services:
  web-app:
    build: ./main/web
    ports:
      - "3000:3000"
    env_file:
      - ./main/web/.env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ccc_postgres_db
    ports:
      - "5433:5432"
    env_file:
      - ./main/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccc_project -d ccc_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
