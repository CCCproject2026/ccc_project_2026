# =============================================================
#  mosquitto.conf — MQTT broker config (local / dev)
#
#  DEV ONLY: anonymous access is allowed, so this file is safe to
#  commit. Do NOT use this file on a public/cloud instance — see
#  mosquitto.prod.conf.example for the production template.
# =============================================================

# ── MQTT over TCP (ESP32 devices, AI server) ──────────────────
listener 1883 0.0.0.0
allow_anonymous true

# ── MQTT over WebSocket (browser viewer pages) ────────────────
listener 9001 0.0.0.0
protocol websockets

# ── Persistence (retained messages survive restarts) ──────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────
# stdout so `docker compose logs mqtt-broker` shows everything
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
